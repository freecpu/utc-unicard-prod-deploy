# ============================================================
# REQ-20261113-01 G6 agent-mp 生产正式接线（2026-11-20，用户 GO）
# 替换 G5-prep 最小 mp-verify.conf（备份 mp-verify.conf.bak-s0-g6-20261120 在机）
# 形态依据：方案§七-2 ＋ 测试机 agentmp.conf 安全头/反代/SPA 范式
# dist＝S6 新三锚（743a11b3/65bb8d50/730fc955，甲1 拆分挂载 bae1057 构建）
# MP_verify 两枚以 alias 精确承接（文件在 /data/apps/agent-mp/ 非 dist 内），
# 80 侧保留供微信 HTTP 校验，其余一律 301→HTTPS。
# ============================================================
server {
    listen 80;
    server_name www.xhc123.work xhc123.work;

    location = /MP_verify_SoTNuLQw5OgweaCg.txt {
        alias /data/apps/agent-mp/MP_verify_SoTNuLQw5OgweaCg.txt;
        default_type text/plain;
    }
    location = /MP_verify_KDA52QyFQzUsiMnR.txt {
        alias /data/apps/agent-mp/MP_verify_KDA52QyFQzUsiMnR.txt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.xhc123.work xhc123.work;
    ssl_certificate     /data/ssl/www.xhc123.work.pem;
    ssl_certificate_key /data/ssl/www.xhc123.work.key;

    root /data/apps/agent-mp/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 微信 MP 校验两枚（精确 location 优先于正则；HTTPS 侧同承接）
    location = /MP_verify_SoTNuLQw5OgweaCg.txt {
        alias /data/apps/agent-mp/MP_verify_SoTNuLQw5OgweaCg.txt;
        default_type text/plain;
    }
    location = /MP_verify_KDA52QyFQzUsiMnR.txt {
        alias /data/apps/agent-mp/MP_verify_KDA52QyFQzUsiMnR.txt;
        default_type text/plain;
    }

    # 点文件一律拒绝（.env 不在 dist 内，防御性兜底）
    location ~ /\. {
        return 404;
    }

    # API 反向代理 → agent-mp 后端（仅回环 7013）
    location /api/ {
        proxy_pass http://127.0.0.1:7013;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA 前端（umi hash 路由·index.html 兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（location 内 add_header 会覆盖 server 级，安全头须重申）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
